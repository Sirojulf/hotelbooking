$kind: http-example
request:
  url: "{{baseUrl}}/guests/reservations/:id/pay"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: string
      description: Reservation ID
  body:
    type: json
    content: |-
      {
        "payment_method": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key_0": "string"
      }
order: 1000
