$kind: http-example
request:
  url: "{{baseUrl}}/guests/reservations"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "booking_source": "string",
        "check_in": "string",
        "check_out": "string",
        "hotel_id": "string",
        "payment_method": "string",
        "room_id": "string",
        "special_requests": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key_0": "string",
        "key_1": "string"
      }
order: 2000
