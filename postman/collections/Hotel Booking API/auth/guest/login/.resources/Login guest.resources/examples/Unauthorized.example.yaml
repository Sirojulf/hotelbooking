$kind: http-example
request:
  url: "{{baseUrl}}/auth/guest/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "login": "string",
        "password": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key_0": "string",
        "key_1": "string"
      }
order: 3000
