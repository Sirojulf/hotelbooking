$kind: http-example
request:
  url: "{{baseUrl}}/rooms/:room_id/availability?check_in=string&check_out=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    - key: check_in
      value: string
      description: Check-in date (YYYY-MM-DD)
    - key: check_out
      value: string
      description: Check-out date (YYYY-MM-DD)
  pathVariables:
    - key: room_id
      value: string
      description: Room ID
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "available": false,
        "currency": "string",
        "nights": 4883,
        "price_per_night": 8154.5515075683525,
        "total_price": 5604.74988036277
      }
order: 1000
