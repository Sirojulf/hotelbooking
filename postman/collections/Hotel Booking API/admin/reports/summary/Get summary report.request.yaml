$kind: http-request
url: "{{baseUrl}}/admin/reports/summary?hotel_id=string&start=string&end=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: hotel_id
    value: string
    description: Hotel ID
  - key: start
    value: string
    description: Start date (YYYY-MM-DD)
  - key: end
    value: string
    description: End date (YYYY-MM-DD)
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Get summary report.resources/examples
order: 1000
