$kind: http-example
request:
  url: "{{baseUrl}}/admin/reports/summary?hotel_id=string&start=string&end=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: hotel_id
      value: string
      description: Hotel ID
    - key: start
      value: string
      description: Start date (YYYY-MM-DD)
    - key: end
      value: string
      description: End date (YYYY-MM-DD)
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "adr": 9916.977706407322,
        "occupancy": 2459.3612617263007,
        "occupancy_by_date": {
          "key_0": 4645.772480344576,
          "key_1": 1842.3492379956097
        },
        "revenue": 3674.888362375588,
        "revpar": 3037.201544548804,
        "total_reservations": 8918
      }
order: 1000
