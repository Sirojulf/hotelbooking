$kind: http-example
request:
  url: "{{baseUrl}}/admin/hotels"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "address": "string",
        "check_in_time": "string",
        "check_out_time": "string",
        "code": "string",
        "image_url": "string",
        "name": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "address": "string",
        "check_in_time": "string",
        "check_out_time": "string",
        "code": "string",
        "created_at": "string",
        "id": "string",
        "image_url": "string",
        "name": "string",
        "settings": {},
        "status": "string"
      }
order: 1000
