$kind: http-request
url: "{{baseUrl}}/admin/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "string",
      "full_name": "string",
      "hotel_id": "string",
      "password": "string",
      "role": "string"
    }
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{apiKey}}"
    in: header
examples: ./.resources/Create staff profile.resources/examples
order: 3000
