$kind: http-example
request:
  url: "{{baseUrl}}/admin/users/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: id
      value: string
      description: Profile ID
  body:
    type: json
    content: |-
      {
        "hotel_id": "string",
        "role": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "key_0": "string",
        "key_1": "string"
      }
order: 2000
