basePath: /api/v1
definitions:
  handler.AdminLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.AdminLoginResponseDoc:
    properties:
      profile:
        $ref: '#/definitions/models.Profile'
      session:
        $ref: '#/definitions/handler.TokenResponseDoc'
    type: object
  handler.CreateProfileRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      hotel_id:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  handler.CreateReservationRequest:
    properties:
      booking_source:
        type: string
      check_in:
        type: string
      check_out:
        type: string
      hotel_id:
        type: string
      payment_method:
        type: string
      room_id:
        type: string
      special_requests:
        type: string
    type: object
  handler.GuestLoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  handler.PayReservationRequest:
    properties:
      payment_method:
        type: string
    type: object
  handler.RegisterGuestRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      hotel_id:
        type: string
      password:
        type: string
      phone_number:
        type: string
      title:
        type: string
    type: object
  handler.TokenResponseDoc:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        additionalProperties: true
        type: object
    type: object
  handler.UpdateProfileRequest:
    properties:
      hotel_id:
        type: string
      role:
        type: string
    type: object
  handler.UpdateReservationRequest:
    properties:
      ai_notes:
        type: string
      checked_in_at:
        type: string
      checked_out_at:
        type: string
      payment_status:
        type: string
    type: object
  models.BookingSource:
    enum:
    - walk_in
    - online
    - phone
    - ota
    - corporate
    type: string
    x-enum-varnames:
    - BookingSourceWalkIn
    - BookingSourceOnline
    - BookingSourcePhone
    - BookingSourceOTA
    - BookingSourceCorporate
  models.CleanStatus:
    enum:
    - clean
    - dirty
    - inspected
    - pickup
    - out_of_order
    - out_of_service
    type: string
    x-enum-varnames:
    - CleanStatusClean
    - CleanStatusDirty
    - CleanStatusInspected
    - CleanStatusPickup
    - CleanStatusOutOfOrder
    - CleanStatusOutOfService
  models.Guest:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      hotel_id:
        type: string
      id:
        type: string
      last_visit_at:
        type: string
      loyalty_points:
        type: integer
      loyalty_tier:
        $ref: '#/definitions/models.GuestTier'
      phone_number:
        type: string
      preferences:
        type: object
      title:
        type: string
      total_spend:
        type: number
      total_stays:
        type: integer
    type: object
  models.GuestTier:
    enum:
    - bronze
    - silver
    - gold
    - platinum
    - diamond
    type: string
    x-enum-varnames:
    - GuestTierBronze
    - GuestTierSilver
    - GuestTierGold
    - GuestTierPlatinum
    - GuestTierDiamond
  models.Hotel:
    properties:
      address:
        type: string
      check_in_time:
        type: string
      check_out_time:
        type: string
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      settings:
        type: object
      status:
        type: string
    type: object
  models.HotelDetailResponse:
    properties:
      hotel:
        $ref: '#/definitions/models.Hotel'
      room_types:
        items:
          $ref: '#/definitions/models.RoomType'
        type: array
    type: object
  models.PaymentStatus:
    enum:
    - pending
    - paid
    - cancelled
    type: string
    x-enum-varnames:
    - PaymentStatusPending
    - PaymentStatusPaid
    - PaymentStatusCancelled
  models.Profile:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      hotel_id:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  models.Reservation:
    properties:
      agent_id:
        type: string
      ai_notes:
        type: string
      booking_source:
        $ref: '#/definitions/models.BookingSource'
      check_in_date:
        type: string
      check_out_date:
        type: string
      checked_in_at:
        type: string
      checked_out_at:
        type: string
      created_at:
        type: string
      guest_id:
        type: string
      hotel_id:
        type: string
      hotels:
        $ref: '#/definitions/models.ReservationHotel'
      id:
        type: string
      payment_method:
        type: string
      payment_status:
        $ref: '#/definitions/models.PaymentStatus'
      room_id:
        type: string
      special_requests:
        type: string
      total_price:
        type: number
    type: object
  models.ReservationHotel:
    properties:
      address:
        type: string
      name:
        type: string
    type: object
  models.Room:
    properties:
      cleaning_status:
        $ref: '#/definitions/models.CleanStatus'
      created_at:
        type: string
      floor_number:
        type: integer
      furniture_condition:
        type: string
      hotel_id:
        type: string
      id:
        type: string
      last_renovation_date:
        type: string
      room_number:
        type: string
      room_type_detail:
        $ref: '#/definitions/models.RoomType'
      room_type_id:
        type: string
      special_notes:
        type: string
      status:
        $ref: '#/definitions/models.RoomStatus'
      updated_at:
        type: string
      wing:
        type: string
    type: object
  models.RoomStatus:
    enum:
    - available
    - occupied
    - maintenance
    type: string
    x-enum-varnames:
    - RoomStatusAvailable
    - RoomStatusOccupied
    - RoomStatusMaintenance
  models.RoomType:
    properties:
      amenities:
        type: object
      base_price:
        type: number
      bed_count:
        type: integer
      bed_type:
        type: string
      capacity:
        type: integer
      created_at:
        type: string
      description:
        type: string
      hotel_id:
        type: string
      id:
        type: string
      images:
        type: object
      name:
        type: string
      price_per_night:
        type: number
      size_sqm:
        type: number
      smoking_allowed:
        type: boolean
      updated_at:
        type: string
      view_type:
        type: string
    type: object
  models.Transaction:
    properties:
      amount:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      reservation_id:
        type: string
      type:
        $ref: '#/definitions/models.TransactionType'
    type: object
  models.TransactionType:
    enum:
    - charge
    - payment
    - refund
    type: string
    x-enum-varnames:
    - TransactionTypeCharge
    - TransactionTypePayment
    - TransactionTypeRefund
  service.AIRecommendRequest:
    properties:
      budget:
        type: number
      check_in:
        type: string
      check_out:
        type: string
      preferences:
        type: string
      query:
        type: string
    type: object
  service.AIRecommendResult:
    properties:
      estimated_price:
        type: number
      hotel_id:
        type: string
      hotel_name:
        type: string
      promo_message:
        type: string
      reasoning:
        type: string
      recommended_room_id:
        type: string
      room_number:
        type: string
    type: object
  service.CreateHotelInput:
    properties:
      address:
        type: string
      check_in_time:
        type: string
      check_out_time:
        type: string
      code:
        type: string
      image_url:
        type: string
      name:
        type: string
    type: object
  service.CreateRoomInput:
    properties:
      floor_number:
        type: integer
      hotel_id:
        type: string
      room_number:
        type: string
      room_type_id:
        type: string
      wing:
        type: string
    type: object
  service.CreateRoomTypeInput:
    properties:
      amenities:
        type: object
      bed_count:
        type: integer
      bed_type:
        type: string
      capacity:
        type: integer
      description:
        type: string
      hotel_id:
        type: string
      images:
        type: object
      name:
        type: string
      price_per_night:
        type: number
      size_sqm:
        type: number
      smoking_allowed:
        type: boolean
      view_type:
        type: string
    type: object
  service.ReportSummary:
    properties:
      adr:
        type: number
      occupancy:
        type: number
      occupancy_by_date:
        additionalProperties:
          format: float64
          type: number
        type: object
      revenue:
        type: number
      revpar:
        type: number
      total_reservations:
        type: integer
    type: object
  service.ReservationCreateResult:
    properties:
      quote:
        $ref: '#/definitions/service.ReservationQuote'
      reservation:
        $ref: '#/definitions/models.Reservation'
      transaction:
        $ref: '#/definitions/models.Transaction'
    type: object
  service.ReservationQuote:
    properties:
      available:
        type: boolean
      currency:
        type: string
      nights:
        type: integer
      price_per_night:
        type: number
      total_price:
        type: number
    type: object
  service.UpdateHotelInput:
    properties:
      address:
        type: string
      check_in_time:
        type: string
      check_out_time:
        type: string
      code:
        type: string
      image_url:
        type: string
      name:
        type: string
      settings:
        type: object
      status:
        type: string
    type: object
  service.UpdateRoomInput:
    properties:
      cleaning_status:
        $ref: '#/definitions/models.CleanStatus'
      floor_number:
        type: integer
      furniture_condition:
        type: string
      room_number:
        type: string
      special_notes:
        type: string
      status:
        $ref: '#/definitions/models.RoomStatus'
      wing:
        type: string
    type: object
  service.UpdateRoomTypeInput:
    properties:
      amenities:
        type: object
      bed_count:
        type: integer
      bed_type:
        type: string
      capacity:
        type: integer
      description:
        type: string
      images:
        type: object
      name:
        type: string
      price_per_night:
        type: number
      size_sqm:
        type: number
      smoking_allowed:
        type: boolean
      view_type:
        type: string
    type: object
info:
  contact: {}
  description: REST API for hotel booking management (guest, booking, admin inventory,
    reports).
  title: Hotel Booking API
  version: "1.0"
paths:
  /admin/hotels:
    get:
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Hotel'
            type: array
      security:
      - BearerAuth: []
      summary: List hotels
      tags:
      - Inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Create hotel
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.CreateHotelInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Hotel'
      security:
      - BearerAuth: []
      summary: Create hotel
      tags:
      - Inventory
  /admin/hotels/{id}:
    delete:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete hotel
      tags:
      - Inventory
    put:
      parameters:
      - description: Hotel ID
        in: path
        name: id
        required: true
        type: string
      - description: Update hotel
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.UpdateHotelInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Hotel'
      security:
      - BearerAuth: []
      summary: Update hotel
      tags:
      - Inventory
  /admin/reports/summary:
    get:
      parameters:
      - description: Hotel ID
        in: query
        name: hotel_id
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ReportSummary'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get summary report
      tags:
      - Reports
  /admin/reservations:
    get:
      parameters:
      - description: Hotel ID
        in: query
        name: hotel_id
        type: string
      - description: Payment status
        in: query
        name: status
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Reservation'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List reservations (admin)
      tags:
      - Reservations
  /admin/reservations/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: string
      - description: Update reservation
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Reservation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update reservation (admin)
      tags:
      - Reservations
  /admin/room-types:
    get:
      parameters:
      - description: Hotel ID
        in: query
        name: hotel_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RoomType'
            type: array
      security:
      - BearerAuth: []
      summary: List room types
      tags:
      - Inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Create room type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.CreateRoomTypeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.RoomType'
      security:
      - BearerAuth: []
      summary: Create room type
      tags:
      - Inventory
  /admin/room-types/{id}:
    delete:
      parameters:
      - description: Room Type ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete room type
      tags:
      - Inventory
    put:
      parameters:
      - description: Room Type ID
        in: path
        name: id
        required: true
        type: string
      - description: Update room type
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.UpdateRoomTypeInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RoomType'
      security:
      - BearerAuth: []
      summary: Update room type
      tags:
      - Inventory
  /admin/rooms:
    get:
      parameters:
      - description: Hotel ID
        in: query
        name: hotel_id
        type: string
      - description: Room Type ID
        in: query
        name: room_type_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Room'
            type: array
      security:
      - BearerAuth: []
      summary: List rooms
      tags:
      - Inventory
    post:
      consumes:
      - application/json
      parameters:
      - description: Create room
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.CreateRoomInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Room'
      security:
      - BearerAuth: []
      summary: Create room
      tags:
      - Inventory
  /admin/rooms/{id}:
    delete:
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete room
      tags:
      - Inventory
    put:
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: string
      - description: Update room
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.UpdateRoomInput'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Room'
      security:
      - BearerAuth: []
      summary: Update room
      tags:
      - Inventory
  /admin/users:
    get:
      parameters:
      - description: Hotel ID
        in: query
        name: hotel_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Profile'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List staff profiles
      tags:
      - Admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Create profile
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.CreateProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Profile'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create staff profile
      tags:
      - Admin
  /admin/users/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: string
      - description: Update profile
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update staff profile
      tags:
      - Admin
  /ai/recommend:
    post:
      consumes:
      - application/json
      description: Agentic AI memilihkan kamar terbaik berdasarkan preferensi tamu.
        Set AI_MOCK=true di .env untuk load testing skala besar.
      parameters:
      - description: Preferensi tamu
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/service.AIRecommendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AIRecommendResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Rekomendasi kamar berbasis AI
      tags:
      - AI
  /auth/admin/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminLoginResponseDoc'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login admin/staff
      tags:
      - Auth
  /auth/guest/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.GuestLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login guest
      tags:
      - Auth
  /auth/guest/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register guest
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterGuestRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Guest'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register guest
